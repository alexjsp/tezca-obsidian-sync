<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Tezca</title>
  <defs>
    <!-- Tile background -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7efe3"/>
      <stop offset="1" stop-color="#e6d6bf"/>
    </linearGradient>
    <!-- Gold frame -->
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d08a"/>
      <stop offset="1" stop-color="#b9822f"/>
    </linearGradient>
    <linearGradient id="frameLip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6421"/>
      <stop offset="1" stop-color="#f1cd86"/>
    </linearGradient>
    <!-- Obsidian -->
    <linearGradient id="glass" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5b34a3"/>
      <stop offset="0.55" stop-color="#2a1252"/>
      <stop offset="1" stop-color="#120623"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.8" r="0.5">
      <stop offset="0" stop-color="#a874ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a874ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <clipPath id="glassClip"><ellipse cx="512" cy="420" rx="168" ry="208"/></clipPath>
  </defs>

  <!-- macOS-grid squircle tile (824pt on a 1024 canvas) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#tileShadow)"/>

  <!-- Oval mirror, centred in the tile -->
  <g transform="translate(512 512) scale(1.22) translate(-512 -420)" filter="url(#shadow)">
    <!-- Frame -->
    <ellipse cx="512" cy="420" rx="226" ry="266" fill="url(#frame)"/>
    <ellipse cx="512" cy="420" rx="186" ry="226" fill="url(#frameLip)"/>
    <!-- Obsidian glass -->
    <ellipse cx="512" cy="420" rx="168" ry="208" fill="url(#glass)"/>
    <g clip-path="url(#glassClip)">
      <ellipse cx="512" cy="420" rx="168" ry="208" fill="url(#glow)"/>
      <!-- Reflection streaks -->
      <g transform="rotate(35 512 420)">
        <rect x="400" y="120" width="70" height="600" fill="url(#streak)"/>
        <rect x="490" y="120" width="28" height="600" fill="url(#streak)"/>
      </g>
    </g>
  </g>
</svg>
