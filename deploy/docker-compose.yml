# Plain HTTP on port 8080. Use this on a trusted LAN, or behind a reverse proxy you already run.
#   cd deploy && docker compose up -d && docker compose logs tezca   # → claim link
services:
  tezca:
    build:
      context: ../server
      dockerfile: ../deploy/Dockerfile
    image: tezca-server:latest
    restart: unless-stopped
    ports:
      # All interfaces by default, for LAN use. If a reverse proxy on this host terminates TLS,
      # set TEZCA_BIND=127.0.0.1 so plain HTTP isn't reachable beside it.
      - "${TEZCA_BIND:-0.0.0.0}:8080:8080"
    environment:
      # The URL your devices use to reach this server (used in claim and invite links). Set it:
      # without it, links follow the request's Host header and the server logs a warning.
      TEZCA_PUBLIC_URL: ${TEZCA_PUBLIC_URL:-}
      TEZCA_SERVER_NAME: ${TEZCA_SERVER_NAME:-Tezca}
    volumes:
      - tezca-data:/data

volumes:
  tezca-data:
