# Public HTTPS with automatic Let's Encrypt certificates via Caddy.
# Needs a DNS name pointing at this host, with ports 80 and 443 reachable from the internet.
#   cd deploy && TEZCA_DOMAIN=notes.example.com docker compose -f compose.caddy.yml up -d
#   docker compose -f compose.caddy.yml logs tezca   # → claim link
services:
  tezca:
    build:
      context: ../server
      dockerfile: ../deploy/Dockerfile
    image: tezca-server:latest
    restart: unless-stopped
    environment:
      TEZCA_PUBLIC_URL: https://${TEZCA_DOMAIN:?set TEZCA_DOMAIN}
      TEZCA_SERVER_NAME: ${TEZCA_SERVER_NAME:-Tezca}
    volumes:
      - tezca-data:/data
    # No published ports: only Caddy talks to it.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [tezca]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TEZCA_DOMAIN: ${TEZCA_DOMAIN:?set TEZCA_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  tezca-data:
  caddy-data:
  caddy-config:
