<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">Tezca</title>
  <desc id="d">Live, end-to-end encrypted sync for Obsidian, on your own server.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1457"/>
      <stop offset="0.55" stop-color="#170a30"/>
      <stop offset="1" stop-color="#0c0519"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#8a5cf5" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8a5cf5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="0.05" r="0.5">
      <stop offset="0" stop-color="#f4d08a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f4d08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4d08a"/>
      <stop offset="1" stop-color="#d3a24f"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="420" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#glowA)"/>
    <rect width="1280" height="420" fill="url(#glowB)"/>
    <!-- faint facets, like light on volcanic glass -->
    <path d="M760 0 L1280 0 L1280 260 Z" fill="#ffffff" opacity="0.035"/>
    <path d="M980 420 L1280 150 L1280 420 Z" fill="#ffffff" opacity="0.025"/>
    <path d="M0 330 L300 420 L0 420 Z" fill="#ffffff" opacity="0.03"/>
  </g>
  <svg x="78" y="70" width="280" height="280" viewBox="0 0 1024 1024">
  
  <defs>
    <!-- Tile background -->
    <linearGradient id="i-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7efe3"/>
      <stop offset="1" stop-color="#e6d6bf"/>
    </linearGradient>
    <!-- Gold frame -->
    <linearGradient id="i-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d08a"/>
      <stop offset="1" stop-color="#b9822f"/>
    </linearGradient>
    <linearGradient id="i-frameLip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6421"/>
      <stop offset="1" stop-color="#f1cd86"/>
    </linearGradient>
    <!-- Obsidian -->
    <linearGradient id="i-glass" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5b34a3"/>
      <stop offset="0.55" stop-color="#2a1252"/>
      <stop offset="1" stop-color="#120623"/>
    </linearGradient>
    <radialGradient id="i-glow" cx="0.7" cy="0.8" r="0.5">
      <stop offset="0" stop-color="#a874ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a874ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i-streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="i-shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="i-tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <clipPath id="i-glassClip"><ellipse cx="512" cy="420" rx="168" ry="208"/></clipPath>
  </defs>

  <!-- macOS-grid squircle tile (824pt on a 1024 canvas) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#i-tile)" filter="url(#i-tileShadow)"/>

  <!-- Oval mirror, centred in the tile -->
  <g transform="translate(512 512) scale(1.22) translate(-512 -420)" filter="url(#i-shadow)">
    <!-- Frame -->
    <ellipse cx="512" cy="420" rx="226" ry="266" fill="url(#i-frame)"/>
    <ellipse cx="512" cy="420" rx="186" ry="226" fill="url(#i-frameLip)"/>
    <!-- Obsidian glass -->
    <ellipse cx="512" cy="420" rx="168" ry="208" fill="url(#i-glass)"/>
    <g clip-path="url(#i-glassClip)">
      <ellipse cx="512" cy="420" rx="168" ry="208" fill="url(#i-glow)"/>
      <!-- Reflection streaks -->
      <g transform="rotate(35 512 420)">
        <rect x="400" y="120" width="70" height="600" fill="url(#i-streak)"/>
        <rect x="490" y="120" width="28" height="600" fill="url(#i-streak)"/>
      </g>
    </g>
  </g>
</svg>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="410" y="154" fill="#ffffff" font-size="112" font-weight="700" letter-spacing="-2">Tezca</text>
    <rect x="414" y="180" width="96" height="5" rx="2.5" fill="url(#gold)"/>
    <text x="412" y="240" fill="#e9e1fb" font-size="34" font-weight="500">Live, end-to-end encrypted sync for Obsidian,</text>
    <text x="412" y="284" fill="#e9e1fb" font-size="34" font-weight="500">on your own server.</text>
    <g font-size="20" font-weight="600" fill="#f4d08a">
      <rect x="412" y="310" width="148" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#f4d08a" stroke-opacity="0.35"/>
      <text x="486" y="335" text-anchor="middle">Live cursors</text>
      <rect x="574" y="310" width="168" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#f4d08a" stroke-opacity="0.35"/>
      <text x="658" y="335" text-anchor="middle">Shared folders</text>
      <rect x="756" y="310" width="144" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#f4d08a" stroke-opacity="0.35"/>
      <text x="828" y="335" text-anchor="middle">Self-hosted</text>
    </g>
  </g>
</svg>
